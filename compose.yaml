name: peer-tutoring
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: peer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peer_local_demo_only}
      POSTGRES_DB: peer_tutoring
    volumes:
      - peer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peer -d peer_tutoring"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:5055:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://peer:${DB_PASSWORD:-peer_local_demo_only}@db:5432/peer_tutoring
    depends_on:
      db:
        condition: service_healthy
volumes:
  peer_data:
